<!doctype html>
<!--
  Skyline mask generator for the hero "KASHMIR behind the mountains" effect.

  Whenever you change images/hero.jpg:
    1. Run the local server:  python3 -m http.server 8080   (from the project folder)
    2. Open http://localhost:8080/tools/skymask.html
    3. Check the preview (red = sky behind the word, blue = cloud drifting in front of it),
       then click "Download" and save both files into images/, replacing the old ones.

  It walks down each column from the top while pixels look like blue sky or white cloud.
-->
<meta charset="utf-8">
<title>Skyline mask</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 24px; background: #eee; }
  canvas { max-width: 100%; display: block; margin: 12px 0; }
  pre { display: none; }
</style>
<p id="msg">Loading images/hero.jpg…</p>
<canvas id="c"></canvas>
<button id="dl" hidden>Download hero-mask.svg and hero-clouds.png</button>
<pre id="svg"></pre>
<pre id="png"></pre>
<script>
const W = 600;
// Tuning (override in the URL, e.g. ?cloud=155&spread=65&gap=10&smooth=10)
const q = new URLSearchParams(location.search);
const CLOUD = +(q.get("cloud") || 155);   // min channel value for cloud/haze
const SPREAD = +(q.get("spread") || 65);  // max channel spread for cloud (low saturation)
const GAP = +(q.get("gap") || 10);         // non-sky pixels in a row that end the sky
const K = +(q.get("smooth") || 10);        // median filter radius in columns
const BLUE = +(q.get("blue") || 90);      // min (blue - red) for clear sky
const BMIN = +(q.get("bmin") || 185);     // min blue value for clear sky
const MAXY = +(q.get("maxy") || 0.4);     // skyline never goes below this fraction of the height
const img = new Image();
img.onload = () => {
  const H = Math.round(W * img.naturalHeight / img.naturalWidth);
  const c = document.getElementById("c");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;

  const isSky = (x, y) => {
    const i = (y * W + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
    const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
    return (b - r > BLUE && b >= BMIN && b >= g) || (mn > CLOUD && mx - mn < SPREAD && b >= r - 5);
  };

  // Per column: walk down until GAP non-sky pixels in a row
  const edge = [];
  for (let x = 0; x < W; x++) {
    let y = 0, miss = 0;
    for (; y < H; y++) {
      if (isSky(x, y)) miss = 0;
      else if (++miss >= GAP) { y -= GAP - 1; break; }
    }
    edge.push(Math.min(y, Math.round(H * MAXY)));
  }
  // Median filter removes stray specks and streaks
  const smooth = edge.map((_, x) => {
    const win = edge.slice(Math.max(0, x - K), x + K + 1).sort((a, b) => a - b);
    return win[win.length >> 1];
  });

  let d = `M0 ${H} L0 ${smooth[0]}`;
  for (let x = 1; x < W; x++) d += ` L${x} ${smooth[x]}`;
  d += ` L${W} ${smooth[W - 1]} L${W} ${H} Z`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><filter id="f"><feGaussianBlur stdDeviation="0.6"/></filter><path d="${d}" fill="#000" filter="url(#f)"/></svg>`;

  // Cloud mask: soft alpha for cloud pixels above the skyline. The page draws these
  // clouds semi-transparently in front of the wordmark, like mist drifting over it.
  const cw = document.createElement("canvas");
  cw.width = W; cw.height = H;
  const cctx = cw.getContext("2d");
  const cloudData = cctx.createImageData(W, H);
  const clamp = (v) => Math.max(0, Math.min(1, v));
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < smooth[x]; y++) {
      const i = (y * W + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
      const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
      const a = clamp((mn - 140) / 70) * clamp((90 - (mx - mn)) / 50);
      cloudData.data[i + 3] = Math.round(a * 255);
    }
  }
  cctx.putImageData(cloudData, 0, 0);
  const soft = document.createElement("canvas");
  soft.width = W; soft.height = H;
  const sctx = soft.getContext("2d");
  sctx.filter = "blur(1.5px)";
  sctx.drawImage(cw, 0, 0);
  const png = soft.toDataURL("image/png");

  // Preview: tint the sky red, clouds blue
  ctx.fillStyle = "rgba(255,0,0,.45)";
  smooth.forEach((y, x) => ctx.fillRect(x, 0, 1, y));
  ctx.globalAlpha = 0.6;
  ctx.globalCompositeOperation = "source-over";
  const tint = document.createElement("canvas");
  tint.width = W; tint.height = H;
  const tctx = tint.getContext("2d");
  tctx.drawImage(soft, 0, 0);
  tctx.globalCompositeOperation = "source-in";
  tctx.fillStyle = "#0050ff";
  tctx.fillRect(0, 0, W, H);
  ctx.drawImage(tint, 0, 0);
  ctx.globalAlpha = 1;

  document.getElementById("svg").textContent = svg;
  document.getElementById("png").textContent = png;
  document.getElementById("msg").textContent = "Red = sky (the word shows here), blue = cloud drawn softly in front of the word. Everything else sits in front of the word.";
  const save = (href, name) => { const a = document.createElement("a"); a.href = href; a.download = name; a.click(); };
  const dl = document.getElementById("dl");
  dl.hidden = false;
  dl.onclick = () => {
    save(URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })), "hero-mask.svg");
    save(png, "hero-clouds.png");
  };
};
img.onerror = () => { document.getElementById("msg").textContent = "Couldn't load images/hero.jpg. Run this through the local server."; };
img.src = "../images/hero.jpg";
</script>
